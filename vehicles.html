<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vehicles | GigReady</title><style>
:root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--green:#20b455;--green2:#159845;--danger:#b42318;--soft:#f7f8fa}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
a{text-decoration:none;color:inherit}.wrap{max-width:1160px;margin:auto;padding:0 24px}
.top{background:#050505;color:#fff}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:28px;font-weight:900}.brand span{color:var(--green)}.navlinks{display:flex;gap:18px;align-items:center}.navlinks a{font-size:14px;font-weight:700}
main{padding:50px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 28px rgba(16,24,40,.05)}
h1{font-size:42px;letter-spacing:-1.5px;margin:0 0 10px}h2{margin:0 0 10px}.muted{color:var(--muted);line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:10px;font-weight:800;border:0;cursor:pointer}
.btn-dark{background:#0b1526;color:#fff}.btn-green{background:var(--green);color:#fff}.btn-light{background:#f2f4f7;color:#111}.btn:disabled{opacity:.55;cursor:not-allowed}
.notice{padding:15px 17px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);margin:18px 0}.success{background:#ecfdf3;border-color:#abefc6}.error{background:#fef3f2;border-color:#fecdca;color:var(--danger)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}
@media(max-width:800px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.navlinks a:not(.primary){display:none}h1{font-size:34px}}
</style></head>
<body><div class="top"><div class="wrap nav"><a class="brand" href="index.html">Gig<span>Ready</span></a>
<div class="navlinks"><a href="index.html">Home</a><a href="vehicles.html">Vehicles</a><a class="btn btn-green primary" href="prequal.html">Check Eligibility</a></div>
</div></div>
<main><div class="wrap">
<h1>Choose your gig-ready vehicle</h1>
<p class="muted">Select an available vehicle to place a 30-minute hold while you complete driver and identity verification.</p>
<div id="sessionBox"></div><div id="cars" class="cars"></div><div id="msg"></div>
</div></main>
<style>
.cars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px;align-items:stretch}.car{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 6px 22px rgba(16,24,40,.05);display:flex;flex-direction:column;min-width:0;height:100%}
.car img{display:block;width:100%;height:230px;object-fit:contain;object-position:center center;background:#f7f8fa;padding:8px;box-sizing:border-box}.carbody{padding:19px;display:flex;flex-direction:column;flex:1}.carbody h2{min-height:58px;margin:8px 0 4px}.carbody .spec{min-height:20px}.carbody .btn{margin-top:auto}.carbody .hold{min-height:32px}.pill{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.pill.soon{background:#fff7ed;color:#9a3412}.section-title{grid-column:1/-1;margin:16px 0 0;font-size:26px}.waitbox{grid-column:1/-1;margin-top:10px;padding:24px;border-radius:18px;background:#f8fafc;border:1px solid var(--line)}
.rate{font-size:30px;font-weight:900;margin:8px 0}.special{display:inline-block;margin-top:12px;padding:6px 9px;border-radius:8px;background:#ecfdf3;color:#166534;font-size:12px;font-weight:900}.was{font-size:14px;color:#667085;text-decoration:line-through;margin-right:7px}.save{font-size:12px;color:#166534;font-weight:800}.spec{color:var(--muted);font-size:14px}.hold{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:900px){.cars{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.cars{grid-template-columns:1fr}.carbody h2,.carbody .spec,.carbody .hold{min-height:0}}
</style>
<script>
const fallback={
"2017 Ford Fusion":"/ford-fusion-2017.png",
"2018 Ford Fusion":"/ford-fusion-2018.png",
"2017 Honda Accord":"/honda-accord-2017.png",
"2018 Honda Accord":"https://commons.wikimedia.org/wiki/Special:Redirect/file/2018%20Honda%20Accord%20front%203.29.18.jpg",
"2018 Toyota Camry":"https://commons.wikimedia.org/wiki/Special:Redirect/file/2018%20Toyota%20Camry%20LE%20front%206.13.18.jpg",
"2019 Toyota Camry":"https://commons.wikimedia.org/wiki/Special:Redirect/file/2018%20Toyota%20Camry%20SE%20front%203.16.18.jpg",
"2018 Toyota Corolla":"https://commons.wikimedia.org/wiki/Special:Redirect/file/2018%20Toyota%20Corolla%2C%20Front%20Right%2C%2001-08-2021.jpg",
"2019 Toyota Corolla":"https://commons.wikimedia.org/wiki/Special:Redirect/file/2019%20Toyota%20Corolla%2C%20Front%20Left%2C%2009-17-2020%20%28cropped%29.jpg",
"2018 Hyundai Sonata":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Hyundai%20Sonata%20LF%20white%20%281%29.jpg",
"2019 Hyundai Sonata":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Hyundai%20Sonata%202.0T%20LF%20white%20%281%29.jpg"
};
const session=JSON.parse(localStorage.getItem('gigreadyApplicant')||'null');
const chosen=localStorage.getItem('gigreadySelectedVehicleId');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function imageFor(v){return (v.photo&&/^https?:/i.test(v.photo)?v.photo:null) || fallback[v.name] || '/pricing-car.png';}
function carCard(v,soon=false){return `<article class="car"><img src="${imageFor(v)}" alt="${esc(v.name)}"><div class="carbody"><span class="pill ${soon?'soon':''}">${soon?'Coming Soon':'Available Now'}</span><h2>${esc(v.name)}</h2><div class="spec">${esc(v.class||'Standard')} • Automatic</div><div class="special">QUALIFY & SIGN UP TODAY SPECIAL</div><div class="rate"><span class="was">$350/week</span>$329<small style="font-size:14px">/week</small></div><div class="save">Save $21/week • qualified drivers who sign up today</div>${soon?'<button class="btn btn-green" style="width:100%" onclick="joinPriorityWaitlist()">Join Priority Waitlist</button><div class="hold">Get priority notice when this vehicle becomes available.</div>':`<button class="btn btn-dark" style="width:100%" onclick="hold('${v.id}')">Request This Car</button><div class="hold">Request this vehicle and GigReady will contact you about availability and next steps.</div>`}</div></article>`}
function joinPriorityWaitlist(){if(!session?.applicantId||!session?.portalToken){localStorage.setItem('gigreadyNextAfterEligibility','vehicles.html?priority=1');location.href='prequal.html?next='+encodeURIComponent('vehicles.html?priority=1');return}submitWaitlist();}
async function submitWaitlist(){
  try{
    const r=await fetch('/api/waitlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({applicantId:session.applicantId,portalToken:session.portalToken})});
    const b=await r.json().catch(()=>({}));
    if(!r.ok){
      // Old browser sessions can reference applicant records from the previous Airtable setup.
      // Clear the stale session and route the driver back through registration instead of exposing a raw Airtable error.
      if(r.status===401 || r.status===403 || /permissions|model was not found|invalid applicant session/i.test(b.error||'')){
        localStorage.removeItem('gigreadyApplicant');
        localStorage.setItem('gigreadyNextAfterEligibility','vehicles.html?priority=1');
        location.href='prequal.html?next='+encodeURIComponent('vehicles.html?priority=1');
        return;
      }
      throw new Error(b.error||'Unable to join the priority list right now.');
    }
    msg.innerHTML='<div class="notice success"><b>You’re on the priority inventory list.</b> We’ll keep your application ready as vehicles become available.</div>';
  }catch(e){
    msg.innerHTML='<div class="notice error">We could not add you to the priority list right now. Please try again.</div>';
  }
}
async function load(){
  sessionBox.innerHTML=session?.status==='Prequalified'
    ? `<div class="notice success">Prequalified as <b>${esc(session.name)}</b>. Choose a vehicle below.</div>`
    : '<div class="notice">You can browse vehicles now. Eligibility is required before a vehicle can be held.</div>';
  try{
    const r=await fetch('/api/vehicles',{cache:'no-store'});const b=await r.json();if(!r.ok)throw new Error(b.error);
    const all=b.vehicles||[], available=all.filter(v=>v.status==='Available'), upcoming=all.filter(v=>v.status==='Coming Soon');
    let html='';
    if(!available.length && upcoming.length) html+='<div class="notice full"><b>All current vehicles are reserved.</b> Join the priority list for upcoming inventory.</div>';
    if(available.length) html+='<h2 class="section-title">Available now</h2>'+available.map(v=>carCard(v,false)).join('');
    if(upcoming.length) html+='<h2 class="section-title">Coming soon</h2>'+upcoming.map(v=>carCard(v,true)).join('');
    if(!all.length) html='<div class="waitbox"><h2>Current fleet is fully reserved</h2><p class="muted">Join the priority inventory list and we’ll keep your application ready for the next vehicle.</p><button class="btn btn-green" onclick="joinPriorityWaitlist()">Join Priority Waitlist</button></div>';
    cars.innerHTML=html;
    const q=new URLSearchParams(location.search);
    if(q.get('autobook')==='1' && chosen && session?.status==='Prequalified'){localStorage.removeItem('gigreadySelectedVehicleId');setTimeout(()=>hold(chosen),350)}
  }catch(e){cars.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}
}
async function hold(vehicleId){
  localStorage.setItem('gigreadySelectedVehicleId',vehicleId);
  // Launch flow is lead-generation first: a vehicle request starts/returns to registration.
  if(!session?.applicantId || !session?.portalToken){
    localStorage.setItem('gigreadyNextAfterEligibility','vehicles.html');
    location.href='prequal.html?requestedVehicle='+encodeURIComponent(vehicleId);
    return;
  }
  msg.innerHTML='<div class="waitbox"><h2>Vehicle request received</h2><p class="muted">Your interest in this vehicle has been noted. GigReady will contact you about availability, final requirements and next steps.</p></div>';
  msg.scrollIntoView({behavior:'smooth'});
}
load();
</script><script>
document.addEventListener('error',function(e){
 if(e.target && e.target.tagName==='IMG' && !e.target.dataset.fallback){
   e.target.dataset.fallback='1';
   e.target.src='/pricing-car.png';
 }
},true);
</script>
</body></html>
