<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Login | GigReady</title><style>:root{--green:#20b455;--ink:#101828;--muted:#667085;--line:#e4e7ec}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#050505;color:#fff}.nav{max-width:1160px;margin:auto;padding:0 24px;min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:28px;font-weight:900}.brand span{color:var(--green)}main{max-width:560px;margin:70px auto;padding:0 24px}.panel{border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 8px 28px rgba(16,24,40,.06)}h1{font-size:38px;margin:0 0 10px}.muted{color:var(--muted);line-height:1.55}label{display:block;font-size:13px;font-weight:800;margin:22px 0 7px}input{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.notice{margin-top:18px;padding:14px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}</style></head><body><div class="top"><div class="nav"><a class="brand" href="/">Gig<span>Ready</span></a><a href="/prequal.html">Check Eligibility</a></div></div><main><div class="panel"><h1>Driver Login</h1><p class="muted">Enter the email used on your GigReady application. We'll email you a secure link to your Driver Dashboard.</p><form id="f"><label>Email address</label><input id="email" type="email" autocomplete="email" required><button id="btn" class="btn">Email My Login Link</button></form><div id="out"></div></div></main><script>f.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Sending…';out.innerHTML='';try{const r=await fetch('/api/driver-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim()})});const b=await r.json();if(!r.ok)throw new Error(b.error||'Unable to send login link.');out.innerHTML='<div class="notice">'+b.message+'</div>';f.reset()}catch(x){out.innerHTML='<div class="notice">'+x.message+'</div>'}finally{btn.disabled=false;btn.textContent='Email My Login Link'}})</script></body></html>
